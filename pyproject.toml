[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shardcore"
version = "1.9.0"
description = "Reference loader, validator, migrator, and neural-substrate runtime for the .shard bundle format."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The SHARDCORE Project" }]
keywords = ["shard", "character", "neuromorphic", "spiking", "lif", "portable-identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: File Formats",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/mr-gl00m/shardcore"
Specification = "https://github.com/mr-gl00m/shardcore/blob/main/SHARDCORE_Spec_v1.9.md"
Roadmap = "https://github.com/mr-gl00m/shardcore/blob/main/ROADMAP.md"
Issues = "https://github.com/mr-gl00m/shardcore/issues"

[project.scripts]
shardcore = "shardcore.__main__:_cli_entry"

[tool.setuptools.packages.find]
include = ["shardcore*"]
exclude = ["tests*", "examples*", "research*", "docs*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research", "docs", "examples/*.shard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
